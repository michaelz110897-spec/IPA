<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Viewer</title>
<link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="content.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #525659;
    font-family: system-ui, sans-serif;
    color: #ddd;
  }
  #viewer {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 12px;
  }
  .page {
    position: relative;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  .page canvas {
    display: block;
  }
  .page .textLayer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 1;
    line-height: 1;
  }
  #status {
    text-align: center;
    padding: 24px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="status">Loading PDF…</div>
<div id="viewer"></div>
<script src="content.js"></script>
<script type="module" src="pdf-viewer.js"></script>
</body>
</html>
